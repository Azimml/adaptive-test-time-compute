name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Runtime deps needed to import the backend + test/lint tooling.
          pip install openai python-dotenv
          # Pin ruff so local and CI agree on lint rules across versions.
          pip install pytest pytest-asyncio "ruff==0.16.0"

      - name: Lint (ruff)
        run: ruff check backend tests

      - name: Run tests
        # No API key needed: the OpenAI client is constructed lazily and the
        # controller tests mock generate_samples.
        env:
          OPENAI_API_KEY: ""
        run: pytest
