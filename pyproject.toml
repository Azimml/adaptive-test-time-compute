[project]
name = "adaptive-test-time-compute"
version = "0.1.0"
description = "Per-instance test-time compute controller for LLM reasoning — consensus-based adaptive sampling."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Azimbek Olimbekov" }]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.pytest.ini_options]
# `evaluator.py` is dependency-free and carries doctest examples, so it is
# collected for doctests directly; the rest of `backend/` pulls in fastapi /
# openai and is exercised through the mocked tests in `tests/`.
testpaths = ["tests", "backend/evaluator.py"]
asyncio_mode = "auto"
addopts = "-ra -q --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]        # pytest fixtures as defaults are idiomatic
"backend/dataset.py" = ["E501"]   # GSM8K preset questions are data, not wrappable code
